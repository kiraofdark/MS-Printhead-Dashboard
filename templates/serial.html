<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serial No. Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #eef2f7; font-size: 13px; }

    .topbar {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: #fff;
      padding: 12px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    .topbar h5 { margin: 0; font-size: 16px; font-weight: 700; }

    .search-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin: 20px auto;
      max-width: 640px;
    }

    /* Timeline */
    .timeline { position: relative; padding: 0; }
    .timeline::before {
      content: '';
      position: absolute;
      top: 8px; bottom: 0; left: 22px;
      width: 2px;
      background: #cbd5e1;
    }
    .tl-item {
      position: relative;
      padding-left: 56px;
      margin-bottom: 16px;
    }
    .tl-dot {
      position: absolute;
      left: 13px; top: 10px;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #cbd5e1;
      z-index: 1;
    }
    .tl-dot.current {
      box-shadow: 0 0 0 3px #22c55e;
      animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green {
      0%,100% { box-shadow: 0 0 0 3px #22c55e; }
      50%      { box-shadow: 0 0 0 6px rgba(34,197,94,.3); }
    }

    .tl-card {
      background: #fff;
      border: 1px solid #dde3eb;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .tl-card.current { border-left: 3px solid #22c55e; }

    .machine-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }
    .color-dot {
      display: inline-block;
      width: 11px; height: 11px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .duration-badge {
      background: #f1f5f9;
      color: #64748b;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .empty-state { text-align: center; padding: 40px; color: #9ca3af; }
    .summary-bar {
      background: #fff;
      border: 1px solid #dde3eb;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="topbar d-flex justify-content-between align-items-center">
  <div>
    <h5><i class="bi bi-upc-scan me-2"></i>Serial No. Search</h5>
    <small style="opacity:.8" data-i18n="subtitle">ติดตาม Printhead จาก Serial No.</small>
  </div>
  <div class="d-flex gap-2 align-items-center">
    <a href="/" class="btn btn-sm btn-light">
      <i class="bi bi-speedometer2"></i> <span data-i18n="nav_dashboard">Dashboard</span>
    </a>
    <a href="/history" class="btn btn-sm btn-outline-light">
      <i class="bi bi-clock-history"></i> <span data-i18n="nav_history">History</span>
    </a>
    <a href="/serials" class="btn btn-sm btn-outline-light">
      <i class="bi bi-list-ul"></i> <span data-i18n="nav_all_serials">All Serials</span>
    </a>
    <div class="btn-group btn-group-sm ms-1">
      <button id="btnTH" class="btn" onclick="setLang('th')">TH</button>
      <button id="btnEN" class="btn" onclick="setLang('en')">EN</button>
    </div>
  </div>
</div>

<div class="container-fluid px-3">

  <!-- Search Box -->
  <div class="search-card">
    <label class="form-label fw-bold mb-2" style="font-size:14px">
      <i class="bi bi-search me-1 text-primary"></i><span data-i18n="search_label">ค้นหา Serial No.</span>
    </label>
    <div class="input-group">
      <input type="text" class="form-control form-control-lg" id="serialInput"
             data-i18n-ph="placeholder"
             style="font-family:monospace;font-size:15px;letter-spacing:.5px"
             onkeydown="if(event.key==='Enter') doSearch()">
      <button class="btn btn-primary px-4" onclick="doSearch()" id="searchBtn">
        <i class="bi bi-search me-1"></i><span data-i18n="search_btn">ค้นหา</span>
      </button>
    </div>
    <div class="text-muted mt-2" style="font-size:11px">
      <i class="bi bi-info-circle me-1"></i><span data-i18n="hint">ค้นหาแบบ partial ได้ เช่น พิมพ์ "256S" เพื่อหาทุก Serial ที่ขึ้นต้นด้วย 256S · ดึงข้อมูล Live จากทุกเครื่อง</span>
    </div>
  </div>

  <!-- Results -->
  <div id="results" style="max-width:800px;margin:0 auto"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── i18n ──────────────────────────────────────────────────────
const LANG = {
  th: {
    subtitle:       'ติดตาม Printhead จาก Serial No.',
    nav_dashboard:  'Dashboard',
    nav_history:    'History',
    nav_all_serials:'All Serials',
    search_label:   'ค้นหา Serial No.',
    placeholder:    'เช่น 256S-1059 หรือ A12F',
    search_btn:     'ค้นหา',
    hint:           'ค้นหาแบบ partial ได้ เช่น พิมพ์ "256S" เพื่อหาทุก Serial ที่ขึ้นต้นด้วย 256S · ดึงข้อมูล Live จากทุกเครื่อง',
    fetching:       'กำลังดึงข้อมูล...',
    fetching_live:  'ดึงข้อมูล Live จากทุกเครื่อง...',
    offline_warn:   'เครื่อง offline — ใช้ข้อมูลจาก DB แทน:',
    not_found:      (q) => `ไม่พบ Serial "<strong>${q}</strong>" ในทุกเครื่อง`,
    not_found_hint: 'ตรวจสอบว่า Serial No. ถูกต้อง หรือเครื่อง offline อยู่',
    found_multi:    (n, q) => `พบ ${n} Serial ที่ตรงกับ "<strong>${q}</strong>":`,
    curr_installed: (m) => `ติดอยู่ปัจจุบัน · ${m}`,
    removed_badge:  'ถอดแล้ว',
    machines_lbl:   'เครื่อง',
    times_lbl:      'ครั้ง',
    total_days_lbl: 'รวม',
    day_unit:       'วัน',
    less1day:       '< 1 วัน',
    present:        'ปัจจุบัน',
    error:          'เกิดข้อผิดพลาด:',
  },
  en: {
    subtitle:       'Track Printhead by Serial No.',
    nav_dashboard:  'Dashboard',
    nav_history:    'History',
    nav_all_serials:'All Serials',
    search_label:   'Search Serial No.',
    placeholder:    'e.g. 256S-1059 or A12F',
    search_btn:     'Search',
    hint:           'Partial search supported — e.g. type "256S" to find all serials starting with 256S · Live data from all machines',
    fetching:       'Fetching...',
    fetching_live:  'Fetching live data from all machines...',
    offline_warn:   'Machine offline — using DB snapshot:',
    not_found:      (q) => `Serial "<strong>${q}</strong>" not found on any machine`,
    not_found_hint: 'Check if the Serial No. is correct or the machine is offline',
    found_multi:    (n, q) => `Found ${n} serials matching "<strong>${q}</strong>":`,
    curr_installed: (m) => `Currently installed · ${m}`,
    removed_badge:  'Removed',
    machines_lbl:   'machines',
    times_lbl:      'time(s)',
    total_days_lbl: 'Total',
    day_unit:       'day(s)',
    less1day:       '< 1 day',
    present:        'Present',
    error:          'Error:',
  },
};
let lang = localStorage.getItem('ms_lang') || 'th';
function t(k) { const v = (LANG[lang]||LANG.th)[k]; return typeof v === 'function' ? v : (v || k); }
function tf(k, ...args) { const v = (LANG[lang]||LANG.th)[k]; return typeof v === 'function' ? v(...args) : (v || k); }

function applyI18n() {
  document.documentElement.lang = lang === 'th' ? 'th' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const isTH = lang === 'th';
  document.getElementById('btnTH').className = `btn ${isTH ? 'btn-light' : 'btn-outline-light'}`;
  document.getElementById('btnEN').className = `btn ${!isTH ? 'btn-light' : 'btn-outline-light'}`;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('ms_lang', l);
  applyI18n();
  if (cachedResult) renderResult(cachedResult);
}

// ── Helpers ───────────────────────────────────────────────────
const COLOR_CSS = {
  'cyan':'#00bcd4','magenta':'#e91e63','yellow':'#fbc02d','black':'#37474f',
  'grey':'#78909c','gray':'#78909c','light cyan':'#80deea','light magenta':'#f48fb1',
  'light yellow':'#fff176','blue':'#1976d2','rhodamine':'#f06292','flavine':'#c6ef00',
  'orange':'#f57c00','light grey':'#b0bec5','light gray':'#b0bec5',
};
const MACHINE_BG = {
  'MS01':'#1565c0','MS02':'#0277bd','MS03':'#006064','MS04':'#2e7d32',
  'MS05':'#558b2f','MS06':'#e65100','MS07':'#bf360c','MS08':'#880e4f',
  'MS09':'#6a1b9a','MS10':'#1a237e','MS11':'#004d40','MS12':'#33691e',
  'MS13':'#f57f17','MS14':'#4e342e','MS15':'#37474f','MS17':'#455a64',
};

function colorDot(name) {
  const k = (name || '').toLowerCase();
  return `<span class="color-dot" style="background:${COLOR_CSS[k]||'#cbd5e1'}"></span>`;
}
function machineBadge(name) {
  return `<span class="machine-badge" style="background:${MACHINE_BG[name]||'#64748b'}">${name}</span>`;
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function tsToDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return `${String(d.getDate()).padStart(2,'0')}-${MONTHS[d.getMonth()]}-${d.getFullYear()}`;
}
function tsToFull(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleString(lang === 'th' ? 'th-TH' : 'en-US');
}
function calcDays(startTs, endTs) {
  const end  = endTs ? endTs * 1000 : Date.now();
  const days = Math.round((end - startTs * 1000) / 86400000);
  if (days < 1) return t('less1day');
  return `${days.toLocaleString()} ${t('day_unit')}`;
}

function groupBySerial(entries) {
  const map = {};
  for (const e of entries) {
    if (!map[e.serial]) map[e.serial] = [];
    map[e.serial].push(e);
  }
  return map;
}

function renderTimeline(serial, entries) {
  const isCurrent = e => e.status === 'installed';

  const machines  = [...new Set(entries.map(e => e.machine))];
  const totalDays = entries.reduce((sum, e) => {
    if (!e.installed_ts) return sum;
    const end = e.removed_ts ? e.removed_ts * 1000 : Date.now();
    return sum + Math.round((end - e.installed_ts * 1000) / 86400000);
  }, 0);
  const currentEntry = entries.find(isCurrent);

  let html = `
    <div class="summary-bar">
      <div>
        <span class="fw-bold" style="font-size:15px;font-family:monospace">${serial}</span>
        ${currentEntry
          ? `<span class="badge bg-success ms-2">${tf('curr_installed', currentEntry.machine)}</span>`
          : `<span class="badge bg-secondary ms-2">${t('removed_badge')}</span>`}
      </div>
      <div class="vr d-none d-sm-block"></div>
      <div class="text-muted" style="font-size:12px">
        <i class="bi bi-cpu me-1"></i>${machines.length} ${t('machines_lbl')}:
        ${machines.map(m => machineBadge(m)).join(' ')}
      </div>
      <div class="vr d-none d-sm-block"></div>
      <div class="text-muted" style="font-size:12px">
        <i class="bi bi-layers me-1"></i>${entries.length} ${t('times_lbl')}
        &nbsp;·&nbsp;
        <i class="bi bi-calendar-range me-1"></i>${t('total_days_lbl')} ${totalDays.toLocaleString()} ${t('day_unit')}
      </div>
    </div>
    <div class="timeline">`;

  for (const e of [...entries].reverse()) {
    const dotColor  = COLOR_CSS[(e.color || '').toLowerCase()] || '#94a3b8';
    const current   = isCurrent(e);
    const dateRange = current
      ? `${tsToDate(e.installed_ts)} &rarr; <span class="text-success fw-bold">${t('present')}</span>`
      : `${tsToDate(e.installed_ts)} &rarr; ${tsToDate(e.removed_ts)}`;
    const colRow = (e.col != null)
      ? `<span class="text-muted ms-2" style="font-size:11px">Col.${e.col} Row.${e.row}</span>`
      : '';

    html += `
      <div class="tl-item">
        <div class="tl-dot ${current ? 'current' : ''}" style="background:${dotColor}"></div>
        <div class="tl-card ${current ? 'current' : ''}">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-1 mb-1">
            <div>${machineBadge(e.machine)} ${colRow}</div>
            <span class="duration-badge">
              <i class="bi bi-clock me-1"></i>${calcDays(e.installed_ts, e.removed_ts)}
            </span>
          </div>
          <div class="mb-1" style="font-size:12px">
            <i class="bi bi-calendar3 me-1 text-muted"></i>${dateRange}
          </div>
          <div class="d-flex gap-3 flex-wrap" style="font-size:12px">
            <span>${colorDot(e.color)}${e.color || '—'}</span>
            <span class="text-muted">${e.ink_type || '—'}</span>
          </div>
        </div>
      </div>`;
  }

  html += '</div>';
  return html;
}

let cachedResult = null;

function renderResult(data) {
  const resultsEl = document.getElementById('results');
  const entries      = data.entries || [];
  const fallbackUsed = data.fallback_used || {};
  const q            = data.serial || '';

  // Remove any previous warning
  const prevWarn = document.getElementById('fbWarning');
  if (prevWarn) prevWarn.remove();

  if (Object.keys(fallbackUsed).length > 0) {
    const fbList = Object.entries(fallbackUsed)
      .map(([m, ts]) => `<strong>${m}</strong> (snapshot: ${ts})`).join(', ');
    resultsEl.insertAdjacentHTML('beforebegin',
      `<div id="fbWarning" class="alert alert-warning alert-sm py-2 mb-2" style="font-size:12px;max-width:800px;margin:0 auto 8px">
        <i class="bi bi-database me-1"></i>
        ${t('offline_warn')} ${fbList}
      </div>`);
  }

  if (entries.length === 0) {
    resultsEl.innerHTML = `
      <div class="empty-state">
        <i class="bi bi-search" style="font-size:2rem"></i>
        <p class="mt-2">${tf('not_found', q)}</p>
        <p class="text-muted" style="font-size:12px">${t('not_found_hint')}</p>
      </div>`;
    return;
  }

  const grouped    = groupBySerial(entries);
  const serialList = Object.keys(grouped).sort();

  let html = '';
  if (serialList.length > 1) {
    html += `<div class="alert alert-info mb-3" style="font-size:12px">
      <i class="bi bi-info-circle me-1"></i>
      ${tf('found_multi', serialList.length, q)}
      ${serialList.map(s =>
        `<code class="ms-1" onclick="document.getElementById('serialInput').value=${JSON.stringify(s)};doSearch()" style="cursor:pointer">${s}</code>`
      ).join(' ')}
    </div>`;
  }
  for (const sn of serialList) {
    html += renderTimeline(sn, grouped[sn]);
    if (serialList.length > 1) html += '<hr class="my-4">';
  }
  resultsEl.innerHTML = html;
}

async function doSearch() {
  const q       = document.getElementById('serialInput').value.trim();
  const results = document.getElementById('results');
  const btn     = document.getElementById('searchBtn');
  if (!q) return;

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${t('fetching')}`;
  results.innerHTML = `<div class="text-center p-4"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">${t('fetching_live')}</p></div>`;

  // Remove stale warning
  const prevWarn = document.getElementById('fbWarning');
  if (prevWarn) prevWarn.remove();

  try {
    const resp = await fetch('/api/serial?q=' + encodeURIComponent(q));
    const data = await resp.json();
    cachedResult = data;
    renderResult(data);
  } catch (e) {
    results.innerHTML = `<div class="alert alert-danger">${t('error')} ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="bi bi-search me-1"></i><span data-i18n="search_btn">${t('search_btn')}</span>`;
  }
}

// Init
applyI18n();

// Auto-search from ?q= query string
const urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) {
  document.getElementById('serialInput').value = urlQ;
  doSearch();
}
</script>
</body>
</html>
